name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run the repeatable JSON decoding benchmark on Linux
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:frontend
      - run: pnpm exec prettier .github/workflows/ci.yml --ignore-path .gitignore --check
      - run: pnpm test:frontend
      - run: pnpm build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-plugin -> target
            src-plugin/examples -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo fmt --all --manifest-path src-plugin/Cargo.toml -- --check
          cargo fmt --all --manifest-path src-plugin/examples/Cargo.toml -- --check
      - name: Clippy with zero warnings
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path src-plugin/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path src-plugin/examples/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test backend and plugin workspaces
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo test --locked --manifest-path src-plugin/Cargo.toml --workspace
          cargo test --locked --manifest-path src-plugin/examples/Cargo.toml --workspace
      - name: Run optional benchmark
        if: github.event_name == 'workflow_dispatch' && inputs.benchmarks && runner.os == 'Linux'
        env:
          BENCH_OUTPUT: ${{ github.workspace }}/api-decode-benchmark.json
        run: cargo bench --locked --manifest-path src-tauri/Cargo.toml --bench api_decode
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.benchmarks && runner.os == 'Linux'
        with:
          name: api-decode-benchmark
          path: api-decode-benchmark.json
          if-no-files-found: error

  quality-gate:
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
